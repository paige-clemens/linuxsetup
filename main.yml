---
- hosts: Local
  gather_subset:
    - "!all"
    - env
  vars:
    deb_arch: "{{ 'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else ('arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else ansible_facts['architecture']) }}"
    is_debian: "{{ ansible_facts['os_family'] == 'Debian' }}"
    is_fedora: "{{ ansible_facts['os_family'] == 'RedHat' }}"
    git_user_name: "Paige Clemens"
    git_user_email: "pclemens365@gmail.com"
  tasks:

  - name: Check for sudo.ws
    ansible.builtin.stat:
      path: /usr/bin/sudo.ws
    register: sudo_ws

  - name: Use sudo.ws instead of sudo-rs
    ansible.builtin.set_fact:
      ansible_become_exe: /usr/bin/sudo.ws
    when: sudo_ws.stat.exists

  - name: Ensure apt keyrings directory exists
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'
    become: true
    when: is_debian
  - name: Download Steam GPG key
    ansible.builtin.get_url:
      url: http://repo.steampowered.com/steam/archive/stable/steam.gpg
      dest: /etc/apt/keyrings/steam.asc
      mode: '0644'
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Dearmor Steam GPG key
    ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/steam.gpg /etc/apt/keyrings/steam.asc
    args:
      creates: /etc/apt/keyrings/steam.gpg
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Clean up old Steam sources
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    become: true
    loop:
      - /etc/apt/sources.list.d/steam.list 
      - /etc/apt/sources.list.d/steam-beta.list
    when: is_debian and deb_arch == 'amd64'

  - name: Add Steam repository
    ansible.builtin.apt_repository:
      repo: "deb [arch=amd64,i386 signed-by=/etc/apt/keyrings/steam.gpg] http://repo.steampowered.com/steam/ stable steam"
      state: present
      filename: steam
      update_cache: false
    register: steam_repo
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Update apt cache
    ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600
    become: true
    when: is_debian

  - name: Install apt prerequisites
    ansible.builtin.apt:
      name:
        - ca-certificates
        - curl
        - gnupg
      state: present
    become: true
    when: is_debian

  - name: Download Spotify GPG key
    ansible.builtin.get_url:
      url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x5384CE82BA52C83A
      dest: /etc/apt/keyrings/spotify.asc
      mode: '0644'
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Dearmor Spotify GPG key
    ansible.builtin.command: gpg --dearmor --yes -o /etc/apt/keyrings/spotify.gpg /etc/apt/keyrings/spotify.asc
    args:
      creates: /etc/apt/keyrings/spotify.gpg
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Add Spotify repository
    ansible.builtin.apt_repository:
      repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/spotify.gpg] https://repository.spotify.com stable non-free"
      state: present
      filename: spotify
      update_cache: false
    register: spotify_repo
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Update apt cache after adding repositories
    ansible.builtin.apt:
      update_cache: yes
    become: true
    when: is_debian and (steam_repo.changed | default(false) or spotify_repo.changed | default(false))

  - name: Enable RPM Fusion Free repository
    ansible.builtin.dnf:
      name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      state: present
      disable_gpg_check: yes
    become: true
    when: is_fedora

  - name: Enable RPM Fusion Nonfree repository
    ansible.builtin.dnf:
      name: "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      state: present
      disable_gpg_check: yes
    become: true
    when: is_fedora

  - name: Import VS Code GPG key (Fedora)
    ansible.builtin.rpm_key:
      key: https://packages.microsoft.com/keys/microsoft.asc
      state: present
    become: true
    when: is_fedora

  - name: Add VS Code repository (Fedora)
    ansible.builtin.yum_repository:
      name: vscode
      description: Visual Studio Code
      baseurl: https://packages.microsoft.com/yumrepos/vscode
      enabled: yes
      gpgcheck: yes
      gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    become: true
    when: is_fedora

  - name: install packages (Debian)
    ansible.builtin.apt:
      name:
        - autoconf
        - automake
        - bash
        - clang-format
        - cmake
        - coreutils
        - dos2unix
        - fping
        - htop
        - p7zip
        - pbzip2
        - pigz
        - tmux
        - vim
        - w3m
        - wget
        - zsh
        - zsh-syntax-highlighting
        - npm
        - redis
        - tree
        - jq
        - apt-transport-https
        - libgl1-mesa-dri:amd64
        - libgl1-mesa-dri:i386
        - wireshark
        - redshift-gtk
        - onedrive
        - thunderbird
      state: present
    become: true
    when: is_debian

  - name: install packages (Fedora)
    ansible.builtin.dnf:
      name:
        - autoconf
        - automake
        - bash
        - clang-tools-extra
        - cmake
        - coreutils
        - dos2unix
        - fping
        - htop
        - p7zip
        - p7zip-plugins
        - pbzip2
        - pigz
        - tmux
        - vim
        - w3m
        - wget
        - zsh
        - zsh-syntax-highlighting
        - npm
        - redis
        - tree
        - jq
        - mesa-dri-drivers
        - wireshark
        - redshift-gtk
        - onedrive
        - thunderbird
      state: present
    become: true
    when: is_fedora

  - name: Install Spotify client (Debian)
    ansible.builtin.apt:
      name: spotify-client
      state: present
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Install Spotify client (Fedora)
    ansible.builtin.command: flatpak install -y flathub com.spotify.Client
    args:
      creates: /var/lib/flatpak/app/com.spotify.Client
    become: true
    when: is_fedora

  - name: Download VS Code deb
    ansible.builtin.get_url:
      url: https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64
      dest: /tmp/vscode.deb
      mode: '0644'
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Install VS Code deb
    ansible.builtin.apt:
      deb: /tmp/vscode.deb
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Install VS Code (Fedora)
    ansible.builtin.dnf:
      name: code
      state: present
    become: true
    when: is_fedora

  - name: Download Bitwarden deb
    ansible.builtin.get_url:
      url: https://vault.bitwarden.com/download/?app=desktop&platform=linux&variant=deb
      dest: /tmp/bitwarden.deb
      mode: '0644'
    become: true
    when: is_debian

  - name: Install Bitwarden deb
    ansible.builtin.apt:
      deb: /tmp/bitwarden.deb
    become: true
    when: is_debian

  - name: Download Bitwarden rpm
    ansible.builtin.get_url:
      url: https://vault.bitwarden.com/download/?app=desktop&platform=linux&variant=rpm
      dest: /tmp/bitwarden.rpm
      mode: '0644'
    become: true
    when: is_fedora

  - name: Install Bitwarden rpm
    ansible.builtin.dnf:
      name: /tmp/bitwarden.rpm
      state: present
      disable_gpg_check: yes
    become: true
    when: is_fedora

  - name: Download Docker Desktop deb
    ansible.builtin.get_url:
      url: https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb
      dest: /tmp/docker-desktop.deb
      mode: '0644'
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Download Docker GPG key
    ansible.builtin.get_url:
      url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
      dest: /etc/apt/keyrings/docker.asc
      mode: '0644'
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Dearmor Docker GPG key
    ansible.builtin.command: gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
    args:
      creates: /etc/apt/keyrings/docker.gpg
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Add Docker repository
    ansible.builtin.apt_repository:
      repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} stable"
      state: present
      filename: docker
      update_cache: false
    register: docker_repo
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Update apt cache after adding Docker repository
    ansible.builtin.apt:
      update_cache: yes
    become: true
    when: is_debian and deb_arch == 'amd64' and docker_repo.changed | default(false)

  - name: Install Docker Desktop dependencies
    ansible.builtin.apt:
      name:
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      state: present
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Install Docker Desktop deb
    ansible.builtin.apt:
      deb: /tmp/docker-desktop.deb
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Add Docker repository (Fedora)
    ansible.builtin.yum_repository:
      name: docker-ce
      description: Docker CE Stable
      baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
      enabled: yes
      gpgcheck: yes
      gpgkey: https://download.docker.com/linux/fedora/gpg
    become: true
    when: is_fedora

  - name: Install Docker (Fedora)
    ansible.builtin.dnf:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      state: present
    become: true
    when: is_fedora

  - name: Start and enable Docker service (Fedora)
    ansible.builtin.systemd:
      name: docker
      state: started
      enabled: yes
    become: true
    when: is_fedora

  - name: Download Discord deb
    ansible.builtin.get_url:
      url: https://discord.com/api/download?platform=linux&format=deb
      dest: /tmp/discord.deb
      mode: '0644'
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Install Discord deb
    ansible.builtin.apt:
      deb: /tmp/discord.deb
    become: true
    when: is_debian and deb_arch == 'amd64'

  - name: Download Discord rpm
    ansible.builtin.get_url:
      url: https://discord.com/api/download?platform=linux&format=tar.gz
      dest: /tmp/discord.tar.gz
      mode: '0644'
    become: true
    when: is_fedora

  - name: Install Discord (Fedora via Flatpak)
    ansible.builtin.command: flatpak install -y flathub com.discordapp.Discord
    args:
      creates: /var/lib/flatpak/app/com.discordapp.Discord
    become: true
    when: is_fedora

  - name: Deploy Updated Profiles
    template:
      backup: true
      dest: "~/.{{ item }}rc"
      src: "templates/{{ item }}_profile"
    loop:
      - "zsh"
      - "bash"

  - name: Configure Git user name
    community.general.git_config:
      name: user.name
      scope: global
      value: "{{ git_user_name }}"

  - name: Configure Git user email
    community.general.git_config:
      name: user.email
      scope: global
      value: "{{ git_user_email }}"

  - name: Setup Oh My Zsh
    shell: sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    args:
      creates: "~/.oh-my-zsh/oh-my-zsh.sh"

  - name: Download Zsh Theme
    get_url:
      url: https://raw.githubusercontent.com/caiogondim/bullet-train-oh-my-zsh-theme/master/bullet-train.zsh-theme
      dest: "~/.oh-my-zsh/custom/themes/bullet-train.zsh-theme"

  - name: Create Fonts Directory
    file:
      path: "~/.fonts/"
      state: directory
      owner: pclemens
      group: pclemens
      mode: '0755'

  - name: Setup Fonts
    connection: local
    copy:
      src: "{{ item }}"
      dest: "/home/pclemens/.fonts/"
      owner: pclemens
      group: pclemens
      mode: '0755'
    with_fileglob:
      - fonts/*.ttf

  - name: List installed VS Code extensions
    ansible.builtin.command: code --list-extensions
    register: vscode_installed
    changed_when: false

  - name: Install VS Code Extentions
    ansible.builtin.command: code --install-extension {{ item }}
    loop:
     - "eamodio.gitlens"
     - "coenraads.bracket-pair-colorizer-2"
     - "docsmsft.docs-markdown"
     - "oderwat.indent-rainbow"
     - "yzhang.markdown-all-in-one"
     - "redhat.vscode-yaml"
     - "dracula-theme.theme-dracula"
     - "Continue.continue"
    when: item | lower not in (vscode_installed.stdout_lines | map('lower') | list)
    changed_when: true

  - name: Fix iPad VNC Tilde Key - Create .inputrc
    copy:
      content: |
        # Map the small tilde character (U+02DC) to regular tilde for iPad VNC
        "˜": "~"
      dest: "~/.inputrc"
      mode: '0644'

  - name: Fix iPad VNC Tilde Key - Create Xmodmap
    copy:
      content: |
        ! Fix tilde key for iPad VNC clients
        ! iPad sends keycode 248 for tilde
        keycode 248 = asciitilde grave asciitilde grave
      dest: "~/.Xmodmap"
      mode: '0644'

  - name: Fix iPad VNC Tilde Key - Create autostart directory
    file:
      path: "~/.config/autostart"
      state: directory
      mode: '0755'

  - name: Fix iPad VNC Tilde Key - Create autostart entry
    copy:
      content: |
        [Desktop Entry]
        Type=Application
        Name=Load Xmodmap
        Exec=xmodmap /home/pclemens/.Xmodmap
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        X-GNOME-Autostart-Delay=2
      dest: "~/.config/autostart/xmodmap.desktop"
      mode: '0644'

  - name: Create Continue config directory
    file:
      path: "~/.continue"
      state: directory
      mode: '0755'

  - name: Read existing Continue config
    ansible.builtin.slurp:
      src: "{{ ansible_env.HOME }}/.continue/config.yaml"
    register: continue_existing
    failed_when: false

  - name: Configure Continue (remote LLM backend)
    copy:
      content: |
        name: Local Config
        version: 1.0.0
        schema: v1
        models:
          - name: Qwen2.5 Coder 32B
            provider: openai
            model: qwen2.5-coder-32b-instruct
            apiBase: http://10.10.101.42:8000/v1
            roles:
              - chat
              - edit
              - apply
              - autocomplete
      dest: "~/.continue/config.yaml"
      mode: '0600'
    when: "continue_existing.content is not defined or 'models: []' in (continue_existing.content | b64decode)"
